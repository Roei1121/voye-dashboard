    });
    const sortedSizes = [...sizes].sort((a,b) => { if(a==='Unlimited') return -1; if(b==='Unlimited') return 1; return parseFloat(a)-parseFloat(b); });

      const filtered = plans.filter(p => {

        if (!price) return false;
        const sOk = t25Size.includes(p.data);
        const dOk = t25Days.includes(String(p.days));
        return sOk && dOk;
      });
      if (!filtered.length) return null;
      const prices = filtered.map(p => isVoye ? (p.new_price||p.price) : p.price);
      return Math.round(prices.reduce((a,b)=>a+b,0)/prices.length*100)/100;
    };
    return TOP25_DATA.map(country => {
      const voye = avg(VOYE_DATA[country]||[], true);
      const comp = {};
      COMPETITORS.forEach(c => { comp[c] = avg((COMP_DATA[c]||{})[country]||[]); });
      const allVals = [voye,...Object.values(comp)].filter(v=>v!=null);
      let status = 'neutral';
      if (voye!=null && allVals.length>1) {
        const mn=Math.min(...allVals), mx=Math.max(...allVals);

      return {country, voye, comp, status};
    });

      vPlans.forEach(vp => {
        const vPrice = vp.new_price||vp.price;
        if (!vPrice) return;
        const compPrices = COMPETITORS.map(c => {
          const match = ((COMP_DATA[c]||{})[country]||[]).find(cp => cp.data===vp.data && cp.days===vp.days);
          return match ? match.price : null;
        }).filter(p => p!==null);
        if (!compPrices.length) return;
        const allP = [vPrice,...compPrices];
        const mn=Math.min(...allP), mx=Math.max(...allP);
        if (vPrice<=mn) nCheap++;
        else if (vPrice>=mx) nPricey++;
        else nMid++;
      });
      const total = nCheap+nMid+nPricey;
      return {country, cheap:total?Math.round(nCheap/total*100):0, mid:total?Math.round(nMid/total*100):0, pricey:total?Math.round(nPricey/total*100):0, total};
    });
  }, []);

  const runAI = useCallback(async () => {

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000,

    let updated = 0, skipped = [];
    rows.forEach(row => {
      const country = (row['Country']||row['country']||'').trim();
      const data = (row['Data']||row['Package']||row['package']||row['data']||'').trim();
      const days = parseInt(row['Days']||row['days']);
      const price = parseFloat(row['Price']||row['price']);
      if (!country||!data||isNaN(days)||isNaN(price)) { skipped.push('invalid row'); return; }
      if (!newVoye[country]) { skipped.push('Unknown: '+country); return; }
      const plan = newVoye[country].find(p => p.data===data && p.days===days);
      if (plan) { plan.new_price=price; plan.changed=true; updated++; }
      else skipped.push(country+' '+data+' '+days+'d');
    });
    setVoyeState(newVoye);
    try { localStorage.setItem('voye_state', JSON.stringify(newVoye)); } catch(ex) {}
    setUploadSummary({updated, skipped: skipped.slice(0,5), total: rows.length});
    e.target.value='';
  }, [voyeState]);

    setUploadSummary(null);
  }, []);

  const buildReportRows = useCallback((type, filter) => {

      const headers = ['Destination','Package','Days','Competitor','Old Price','New Price','Change %','Direction'];
      const rows = (DIFF_DATA.changes||[])

      const rawRows = (DIFF_DATA.changes||[])

                    const voyeP = manualEdits[vKey] !== undefined ? (parseFloat(manualEdits[vKey])||baseVoyeP) : baseVoyeP;
                    const _isUnl = (s) => (s||'').toLowerCase() === 'unlimited';
                    const _findMatch = (cplans, pd, pdays) => {
                      return cplans.find(cp => cp.data === pd && cp.days === pdays)
                          || cplans.find(cp => cp.data === pd)
                          || null;
                    };
                    const _estimatePrice = (cplans, pd) => {
                      if (!pd || _isUnl(pd)) return null;
                      const gbNum = parseFloat(pd);
                      if (isNaN(gbNum) || gbNum <= 0) return null;
                      const capped = cplans.filter(cp => cp.data && !_isUnl(cp.data) && parseFloat(cp.data) > 0 && cp.price > 0);
                      if (!capped.length) return null;
                      const avgPerGB = capped.reduce((s,cp) => s + cp.price/parseFloat(cp.data), 0) / capped.length;
                      return Math.round(avgPerGB * gbNum * 100) / 100;
                    };
                    const compPricesRaw = COMPETITORS.map((comp,j) => {
                      const cKey = 'comp|'+comp+'|'+selCountry+'|'+(p.data||'')+'|'+p.days;

                      if (manualEdits[cKey] !== undefined) return {price: parseFloat(manualEdits[cKey])||null, isEst:false, isEdited:true};
                      const match = _findMatch(cplans, p.data, p.days);
                      if (match) return {price: match.price, isEst:false, isEdited:false};
                      const est = _estimatePrice(cplans, p.data);
                      return {price: est, isEst: est !== null, isEdited:false};
                    });
                    const compPrices = compPricesRaw.map(r => r.price);
                    const validPrices = compPrices.filter(x => x !== null && x > 0);
                    const avgComp = validPrices.length ? validPrices.reduce((a,b)=>a+b,0)/validPrices.length : null;

                            : <span style={{fontFamily:"'Roboto Mono',monospace",fontSize:13,color:manualEdits[vKey]!==undefined?'#D97706':'#6366F1',fontWeight:700}}>${voyeP!=null?voyeP.toFixed(2):'—'}</span>
                          }
                        </td>
                        {COMPETITORS.map((comp,j) => {
                          const cKey = 'comp|'+comp+'|'+selCountry+'|'+(p.data||'')+'|'+p.days;
                          const cplans = (COMP_DATA[comp]||{})[selCountry] || [];
                          const raw = compPricesRaw[j];
                          const cp = raw ? raw.price : null;
                          const isEst = raw ? raw.isEst : false;
                          const isEdited = raw ? raw.isEdited : false;
                          const exactMatch = _findMatch(cplans, p.data, p.days);
                          const baseCompP = exactMatch ? exactMatch.price : null;
                          const cheaper = cp!=null && voyeP!=null && cp < voyeP;
                          const pricier = cp!=null && voyeP!=null && cp > voyeP;
                          const priceColor = isEdited?'#D97706':(cheaper?'#EF4444':pricier?'#10B981':'#94A3B8');
                          const estTitle = 'Estimated: no exact '+comp+' match for '+(p.data||'?')+' — calculated from their avg cost-per-GB across '+(cplans.filter(c=>c.data&&!_isUnl(c.data)).length)+' plans in this country';
                          return (
                            <td key={j} style={{padding:'11px 16px',textAlign:'right'}}>
                              {editMode
                                ? (baseCompP !== null || isEdited)
                                  ? <input type="number" step="0.01" style={{width:72,background:isEdited?'#FFFBEB':'#F8F9FC',border:'1px solid '+(isEdited?'#F59E0B':'#E2E8F0'),borderRadius:6,color:isEdited?'#D97706':(cheaper?'#EF4444':pricier?'#10B981':'#64748B'),padding:'4px 7px',fontSize:12,textAlign:'right',fontFamily:"'Roboto Mono',monospace",outline:'none'}} value={isEdited ? manualEdits[cKey] : (baseCompP||'').toString()} onChange={e => setManualEdits(prev => ({...prev, [cKey]: e.target.value}))} />
                                  : <span style={{color:'#CBD5E1',fontSize:11}}>—</span>
                                : cp !== null
                                  ? <span
                                      style={{fontFamily:"'Roboto Mono',monospace",fontSize:isEst?11:13,fontStyle:isEst?'italic':'normal',color:priceColor,opacity:isEst?0.8:1,cursor:isEst?'help':'default'}}
                                      title={isEst ? estTitle : undefined}
                                    >{isEst?'~':''}${cp.toFixed(2)}</span>
                                  : <span style={{color:'#CBD5E1',fontSize:11}}>—</span>
                              }
                            </td>
                          );
                        })}
                        <td style={{padding:'11px 16px',textAlign:'right'}}>
                          {posPct !== null ? <Pill cls={posPct>10?'dn':posPct<-10?'up':'na'} text={(posPct>0?'+':'')+posPct+'%'} /> : <span style={{color:'#CBD5E1',fontSize:11}}>—</span>}
                        </td>
                      </tr>
                    );
                  })}

                      <tr style={{background:'#F8F9FC',borderBottom:'2px solid #E8EBF0'}}>
                        {previewHeaders.map((h,i) => (
                          <th key={i} style={{padding:'9px 14px',fontSize:10,color:'#64748B',fontWeight:600,letterSpacing:'.5px',textTransform:'uppercase',textAlign:'left',whiteSpace:'nowrap'}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {previewRows.map((row,ri) => (
                        <tr key={ri} className="tbl-row" style={{borderBottom:'1px solid #F1F5F9'}}>
                          {row.map((cell,ci) => (
                            <td key={ci} style={{padding:'9px 14px',fontSize:12,color:ci===0?'#1A1D2E':(ci===7&&cell==='▲ Up'?'#EF4444':ci===7&&cell==='▼ Down'?'#10B981':'#64748B'),fontWeight:ci===0?600:400,whiteSpace:'nowrap',fontFamily:ci>=3&&ci<=6?"'Roboto Mono',monospace":'inherit'}}>{String(cell)}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                {previewTotal > 10 && <div style={{marginTop:10,fontSize:12,color:'#94A3B8',textAlign:'center'}}>… and {previewTotal-10} more rows in the full download</div>}
              </div>
            )}

          </>}

        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
